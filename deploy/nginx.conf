# Reverse proxy for DuoLang.
# Copy to /etc/nginx/sites-available/duolang, symlink into sites-enabled,
# replace YOUR_DOMAIN, then run certbot (see deploy/README.md).
# Certbot rewrites this file to add the TLS listener and an HTTP->HTTPS redirect.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker must never be served stale, or clients get pinned
    # to an old cached build.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        proxy_set_header Host $host;
        # Drop the upstream header first, or the response carries two of them.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
