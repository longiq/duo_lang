<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DuoLang</title>
  <meta name="theme-color" content="#eaece9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <!-- iOS ignores most of the manifest, so the standalone behaviour, home
       screen name, status bar style and icon all have to be declared here. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DuoLang" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <span class="wordmark">DuoLang</span>
      <!-- States the routing rather than selling the app. JS keeps it in sync
           with whichever language you are speaking. -->
      <span class="routing" id="subtitle"></span>
    </header>

    <section class="say">
      <div class="switch" id="langSwitch" role="group" aria-label="Ngôn ngữ bạn nói">
        <!-- Names what the row controls: without it the language names read the
             same as the pane headings below and look like labels, not choices. -->
        <span class="switch-label" aria-hidden="true">Nói</span>
        <button type="button" class="lang-btn" data-lang="vi">Tiếng Việt</button>
        <button type="button" class="lang-btn" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="ja">日本語</button>
      </div>
      <!-- One row: autoGrow expands it as text arrives. -->
      <textarea id="sourceText" class="said" rows="1"
                autocomplete="off" autocapitalize="sentences" spellcheck="false"
                aria-label="Câu bạn vừa nói, sửa được"></textarea>
    </section>

    <!-- The two panes below are what a stranger reads off the screen, so they
         carry the largest type on the page. -->
    <section class="pane" id="targetCard0">
      <div class="pane-head">
        <h2 class="tongue" id="targetLabel0"></h2>
        <button class="hear" id="speakBtn0" aria-label="Nghe bản dịch thứ nhất" disabled>
          <span class="hear-mark" aria-hidden="true"></span>Nghe
        </button>
      </div>
      <p id="targetText0" class="phrase placeholder"></p>
    </section>

    <section class="pane" id="targetCard1">
      <div class="pane-head">
        <h2 class="tongue" id="targetLabel1"></h2>
        <button class="hear" id="speakBtn1" aria-label="Nghe bản dịch thứ hai" disabled>
          <span class="hear-mark" aria-hidden="true"></span>Nghe
        </button>
      </div>
      <p id="targetText1" class="phrase placeholder"></p>
    </section>

    <p id="errorMsg" class="notice" hidden></p>
  </main>

  <div class="deck">
    <div class="deck-inner">
      <p id="micStatus" class="cue"></p>
      <div class="deck-row">
        <span class="deck-slot"></span>
        <button id="micBtn" class="capture" aria-label="Nhấn để nói">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/>
          </svg>
        </button>
        <span class="deck-slot">
          <button type="button" id="retranslateBtn" class="again" disabled>Dịch lại</button>
        </span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
